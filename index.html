<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Hoodie 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; background:#0d0020; font-family:'Segoe UI',sans-serif; }
canvas { display:block; width:100vw; height:100vh; }
#hud { position:fixed; top:16px; right:16px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,80,80,0.4); border-radius:12px; padding:10px 18px; color:#fff; font-size:13px; backdrop-filter:blur(8px); pointer-events:none; }
#hud span { color:#ff6060; font-weight:700; }
#keys { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.12); border-radius:40px; padding:9px 22px; backdrop-filter:blur(8px); pointer-events:none; }
.k { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.28); border-radius:6px; padding:3px 9px; color:#fff; font-size:12px; font-weight:700; }
.kl { color:rgba(255,255,255,0.55); font-size:11px; }
#loading { position:fixed; inset:0; background:#0d0020; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; transition:opacity 0.7s; }
#loading h1 { color:#ff4444; font-size:2.2rem; font-weight:900; letter-spacing:4px; margin-bottom:6px; }
#loading p { color:rgba(255,255,255,0.45); font-size:13px; margin-bottom:28px; }
.bar { width:260px; height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
.fill { height:100%; background:linear-gradient(90deg,#ff3333,#ff9999); width:0%; transition:width 0.35s; }
#ltxt { color:rgba(255,255,255,0.35); font-size:11px; margin-top:10px; }
</style>
</head>
<body>
<div id="loading">
  <h1>CRIMSON HOODIE</h1>
  <p>Cargando personaje 3D...</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="ltxt">Preparando...</div>
</div>
<canvas id="c"></canvas>
<div id="hud">Animación: <span id="aname">Idle</span></div>
<div id="keys">
  <span class="k">W/↑</span><span class="kl">Caminar</span>
  <span class="k">⇧+W</span><span class="kl">Correr</span>
  <span class="k">Esp</span><span class="kl">Saltar</span>
  <span class="k">A D</span><span class="kl">Girar</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const sp = (p,t) => { document.getElementById('fill').style.width=p+'%'; document.getElementById('ltxt').textContent=t; };

window.addEventListener('load', async () => {
  const canvas = document.getElementById('c');
  const R = new THREE.WebGLRenderer({canvas, antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));
  R.setSize(innerWidth,innerHeight);
  R.shadowMap.enabled = true;
  R.shadowMap.type = THREE.PCFSoftShadowMap;
  R.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x4a9eff);
  scene.fog = new THREE.Fog(0x4a9eff, 17, 26);

  // Cámara normal — personaje estará a escala 1.7m
  const cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
  cam.position.set(0, 2, 5);
  cam.lookAt(0, 1, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
  sun.position.set(8,15,8); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-10; sun.shadow.camera.right=10;
  sun.shadow.camera.top=10;  sun.shadow.camera.bottom=-10;
  sun.shadow.camera.near=0.5; sun.shadow.camera.far=60;
  scene.add(sun);
  const fl=new THREE.DirectionalLight(0xadd8ff,0.4); fl.position.set(-6,4,-4); scene.add(fl);

  // Suelo
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0x3db33d}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  const grid=new THREE.GridHelper(200,100,0x2a8a2a,0x2a8a2a);
  grid.position.y=0.005; grid.material.opacity=0.22; grid.material.transparent=true; scene.add(grid);

  const gc=[0x2e9e2e,0x36b036,0x28882e,0x3ac43a];
  for(let i=0;i<300;i++){
    const h=0.06+Math.random()*0.18;
    const b=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.035,h,4),new THREE.MeshLambertMaterial({color:gc[i%4]}));
    const a=Math.random()*Math.PI*2,d=3+Math.random()*35;
    b.position.set(Math.cos(a)*d,h/2,Math.sin(a)*d); scene.add(b);
  }
  const cmat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.9});
  for(let i=0;i<10;i++){
    const g=new THREE.Group();
    for(let j=0;j<6;j++){
      const s=new THREE.Mesh(new THREE.SphereGeometry(1.2+Math.random()*2,8,6),cmat);
      s.position.set((Math.random()-.5)*7,(Math.random()-.5)*1.5,(Math.random()-.5)*3); g.add(s);
    }
    g.position.set((Math.random()-.5)*100,13+Math.random()*12,-10-Math.random()*60); scene.add(g);
  }

  // Cargar GLBs
  const loader=new THREE.GLTFLoader();
  const load=(url,label,pct)=>new Promise(res=>{
    sp(pct,`Cargando ${label}...`);
    loader.load(url,res,undefined,e=>{console.error(label,e);res(null);});
  });
  const M='models/';
  const gChar=await load(M+'Meshy_AI_Crimson_Hoodie_Portra_biped_Character_output.glb','personaje',15);
  const gWalk=await load(M+'Meshy_AI_Crimson_Hoodie_Portra_biped_Animation_Walking_withSkin.glb','walking',40);
  const gRun =await load(M+'Meshy_AI_Crimson_Hoodie_Portra_biped_Animation_Running_withSkin.glb','running',65);
  const gJump=await load(M+'Meshy_AI_Animation_Regular_Jump_withSkin.glb','jumping',80);
  const gTree  = await load(M+'tree.glb',    'arboles', 80);
  const gHouseA= await load(M+'house_a.glb', 'casa A',  86);
  const gHouseB= await load(M+'house_b.glb', 'casa B',  90);
  const gHouseC= await load(M+'house_c.glb', 'casa C',  94);
  const gHouseD= await load(M+'house_d.glb', 'casa D',  98);
  sp(100,'¡Listo!');

  // CAMINOS con InstancedMesh (una sola draw call, muy eficiente)
  const pathMat=new THREE.MeshLambertMaterial({color:0x8B6340});
  const tileGeo=new THREE.PlaneGeometry(1,1);

  // Generar posiciones de todas las baldosas
  const tilePosNS=[], tileEO1=[], tileEO2=[];
  for(let z=-150;z<=150;z++) for(let x=-2;x<=1;x++) tilePosNS.push([x+0.5,z+0.5]);
  for(let x=-150;x<=150;x++) for(let dz=-2;dz<=1;dz++){
    if(Math.abs(x+0.5)>2.5){ tileEO1.push([x+0.5,-30+dz+0.5]); tileEO2.push([x+0.5,50+dz+0.5]); }
  }

  const buildInstanced=(positions)=>{
    const mesh=new THREE.InstancedMesh(tileGeo,pathMat,positions.length);
    mesh.receiveShadow=true;
    const m=new THREE.Matrix4();
    const rot=new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,0));
    positions.forEach(([x,z],i)=>{
      m.compose(new THREE.Vector3(x,0.01,z),rot,new THREE.Vector3(1,1,1));
      mesh.setMatrixAt(i,m);
    });
    mesh.instanceMatrix.needsUpdate=true;
    scene.add(mesh);
    return mesh;
  };

  buildInstanced(tilePosNS);
  buildInstanced(tileEO1);
  buildInstanced(tileEO2);

  // ── FAROLAS (solo las cercanas al origen, pocas PointLights) ────
  const poleMat=new THREE.MeshLambertMaterial({color:0x444444});
  const bulbMat=new THREE.MeshLambertMaterial({color:0xffffaa,emissive:0xffff66,emissiveIntensity:1});
  const addLamp=(x,z)=>{
    const g=new THREE.Group();
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,3,6),poleMat);
    pole.position.y=1.5; g.add(pole);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6),bulbMat);
    bulb.position.y=3.1; g.add(bulb);
    // Solo añadir PointLight a las farolas muy cercanas al origen (para no matar la GPU)
    if(Math.abs(x)<30 && Math.abs(z)<30){
      const pl=new THREE.PointLight(0xffffaa,0.8,10); pl.position.y=3; g.add(pl);
    }
    g.position.set(x,0,z); g.castShadow=true; scene.add(g);
  };
  // Farolas cada 10u solo en zona central visible
  for(let z=-60;z<=60;z+=10){addLamp(-2.5,z);addLamp(2.5,z);}
  for(let x=-60;x<=60;x+=10){if(Math.abs(x)>3){addLamp(x,-32.5);addLamp(x,47.5);}}

  // ── ÁRBOLES con InstancedMesh (una sola draw call) ───────────
  if(gTree){
    // Recoger geometrías y materiales del árbol
    const treeMeshes=[];
    gTree.scene.traverse(ch=>{ if(ch.isMesh) treeMeshes.push(ch); });

    // Generar posiciones de árboles (solo bordes de caminos, cada 8u)
    const treePositions=[];
    for(let z=-120;z<=120;z+=8){
      treePositions.push([-4,z,0.8+Math.random()*0.4,Math.random()*Math.PI*2]);
      treePositions.push([ 4,z,0.8+Math.random()*0.4,Math.random()*Math.PI*2]);
    }
    for(let x=-120;x<=120;x+=8){
      if(Math.abs(x)<4)continue;
      treePositions.push([x,-35,0.8+Math.random()*0.4,Math.random()*Math.PI*2]);
      treePositions.push([x, 51,0.8+Math.random()*0.4,Math.random()*Math.PI*2]);
    }

    // Crear InstancedMesh por cada submesh del árbol
    const dummy=new THREE.Object3D();
    treeMeshes.forEach(tm=>{
      const im=new THREE.InstancedMesh(tm.geometry, tm.material, treePositions.length);
      im.castShadow=true; im.receiveShadow=true;
      treePositions.forEach(([x,z,s,ry],i)=>{
        dummy.position.set(x,0,z);
        dummy.rotation.set(0,ry,0);
        dummy.scale.setScalar(s);
        dummy.updateMatrix();
        im.setMatrixAt(i,dummy.matrix);
      });
      im.instanceMatrix.needsUpdate=true;
      scene.add(im);
    });
  }


  let char=null,mixer=null;
  const anims={};
  let curAct=null;

  if(gChar){
    char=gChar.scene;

    // ★ ESCALA CORRECTA: el GLB está en centímetros → escalar a 0.01 para obtener metros
    // El personaje mide ~170cm → 170 * 0.01 = 1.7 unidades (metros)
    char.scale.setScalar(1.0);
    char.position.set(0,0,0);
    char.rotation.y = 0;
    char.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});
    scene.add(char);

    mixer=new THREE.AnimationMixer(char);
    const addA=(g,name,loop=true)=>{
      if(!g?.animations?.length)return;
      const a=mixer.clipAction(g.animations[0]);
      if(!loop){a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;}
      anims[name]=a;
    };
    addA(gChar,'idle'); addA(gWalk,'walk'); addA(gRun,'run'); addA(gJump,'jump',false);
    if(anims['jump']) anims['jump'].timeScale = 2;
  }

  setTimeout(()=>{const el=document.getElementById('loading');el.style.opacity='0';setTimeout(()=>el.style.display='none',700);},300);

  const lbls={idle:'Idle',walk:'Caminando',run:'Corriendo',jump:'Saltando'};
  const play=name=>{
    if(!mixer)return;
    const next=anims[name]||anims['idle'];
    if(!next||curAct===next)return;
    if(curAct)curAct.fadeOut(0.2);
    next.reset().fadeIn(0.2).play();
    curAct=next;
    document.getElementById('aname').textContent=lbls[name]||'Idle';
  };
  setTimeout(()=>play('idle'),500);

  const K={};
  addEventListener('keydown',e=>{K[e.code]=true;});
  addEventListener('keyup',e=>{K[e.code]=false;});
  let jumping=false,jv=0;
  addEventListener('keydown',e=>{
    if(e.code==='Space'&&!jumping&&char){
      jumping=true;jv=4.832;play('jump');
      if(anims['jump']){
        mixer.addEventListener('finished',function cb(ev){
          if(ev.action===anims['jump']){
            jumping=false;mixer.removeEventListener('finished',cb);
            play((K.KeyW||K.ArrowUp)?((K.ShiftLeft||K.ShiftRight)?'run':'walk'):'idle');
          }
        });
      }
    }
  });




  // ── CASAS solo bordeando caminos (pocas, aleatorias) ──────────
  const houseModels=[gHouseA,gHouseB,gHouseC,gHouseD].filter(Boolean);
  const placeHouse=(x,z,ry)=>{
    if(!houseModels.length)return;
    const g=houseModels[Math.floor(Math.random()*houseModels.length)];
    const h=g.scene.clone(true);
    const s=3;
    h.scale.setScalar(s);
    h.position.set(x,0.681*s,z);
    h.rotation.y=ry||0;
    h.traverse(ch=>{if(ch.isMesh){ch.castShadow=true;ch.receiveShadow=true;}});
    scene.add(h);
  };
  // Camino N-S: casas cada 20u, probabilidad 60%
  for(let z=-100;z<=100;z+=20){
    if(Math.random()<0.6) placeHouse(-12+(Math.random()-.5)*4, z, Math.random()*Math.PI*2);
    if(Math.random()<0.6) placeHouse( 12+(Math.random()-.5)*4, z, Math.random()*Math.PI*2);
  }
  // Camino E-O z=-30
  for(let x=-100;x<=100;x+=20){
    if(Math.abs(x)<5)continue;
    if(Math.random()<0.5) placeHouse(x, -42+(Math.random()-.5)*4, Math.random()*Math.PI*2);
    if(Math.random()<0.5) placeHouse(x, -18+(Math.random()-.5)*4, Math.random()*Math.PI*2);
  }
  // Camino E-O z=50
  for(let x=-100;x<=100;x+=20){
    if(Math.abs(x)<5)continue;
    if(Math.random()<0.5) placeHouse(x, 42+(Math.random()-.5)*4, Math.random()*Math.PI*2);
    if(Math.random()<0.5) placeHouse(x, 58+(Math.random()-.5)*4, Math.random()*Math.PI*2);
  }


  // ── CULLING — construido DESPUÉS de todo ──────────────────────
  const CULL_DIST2 = 30*30;
  const worldObjs = scene.children.filter(o=>
    !o.isLight && !o.isCamera && o!==ground && o!==grid && o!==char
  );
  const cullAll=()=>{
    if(!char)return;
    const cx=char.position.x, cz=char.position.z;
    worldObjs.forEach(o=>{
      if(o===char)return;
      const dx=o.position.x-cx, dz=o.position.z-cz;
      o.visible=(dx*dx+dz*dz)<CULL_DIST2;
    });
  };


  const CAM_OFF=new THREE.Vector3(0,1.6,-4.5);
  const camTgt=new THREE.Vector3(0,1,0);
  const clk=new THREE.Clock();

  (function loop(){
    requestAnimationFrame(loop);
    const dt=Math.min(clk.getDelta(),0.05);
    if(mixer)mixer.update(dt);
    if(char){
      const spd=(K.ShiftLeft||K.ShiftRight)?5.5:2.8;
      if(K.KeyA||K.ArrowLeft) char.rotation.y+=2.2*dt;
      if(K.KeyD||K.ArrowRight)char.rotation.y-=2.2*dt;
      let mov=false;
      if(K.KeyW||K.ArrowUp){
        const d=new THREE.Vector3(Math.sin(char.rotation.y),0,Math.cos(char.rotation.y));
        char.position.addScaledVector(d,spd*dt); mov=true;
      }
      if(jumping){jv+=-10*dt;char.position.y+=jv*dt;if(char.position.y<=0){char.position.y=0;if(!anims['jump']){jumping=false;jv=0;}}}
      if(!jumping){
        if(mov&&(K.ShiftLeft||K.ShiftRight))play('run');
        else if(mov)play('walk');
        else play('idle');
      }
      const wo=CAM_OFF.clone().applyEuler(new THREE.Euler(0,char.rotation.y,0));
      cam.position.lerp(char.position.clone().add(wo),1-Math.pow(0.001,dt));
      camTgt.lerp(char.position.clone().add(new THREE.Vector3(0,1,0)),1-Math.pow(0.0001,dt));
      cam.lookAt(camTgt);
    }
    R.render(scene,cam);
  })();

  addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
});
</script>
</body>
</html>
