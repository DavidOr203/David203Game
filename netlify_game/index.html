<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Hoodie 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; background:#0d0020; font-family:'Segoe UI',sans-serif; }
canvas { display:block; width:100vw; height:100vh; }
#hud { position:fixed; top:16px; right:16px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,80,80,0.4); border-radius:12px; padding:10px 18px; color:#fff; font-size:13px; backdrop-filter:blur(8px); pointer-events:none; }
#hud span { color:#ff6060; font-weight:700; }
#keys { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.12); border-radius:40px; padding:9px 22px; backdrop-filter:blur(8px); pointer-events:none; }
.k { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.28); border-radius:6px; padding:3px 9px; color:#fff; font-size:12px; font-weight:700; }
.kl { color:rgba(255,255,255,0.55); font-size:11px; }
#loading { position:fixed; inset:0; background:#0d0020; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; transition:opacity 0.7s; }
#loading h1 { color:#ff4444; font-size:2.2rem; font-weight:900; letter-spacing:4px; margin-bottom:6px; }
#loading p { color:rgba(255,255,255,0.45); font-size:13px; margin-bottom:28px; }
.bar { width:260px; height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
.fill { height:100%; background:linear-gradient(90deg,#ff3333,#ff9999); width:0%; transition:width 0.35s; }
#ltxt { color:rgba(255,255,255,0.35); font-size:11px; margin-top:10px; }
</style>
</head>
<body>
<div id="loading">
  <h1>CRIMSON HOODIE</h1>
  <p>Cargando mundo 3D...</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="ltxt">Preparando...</div>
</div>
<canvas id="c"></canvas>
<div id="hud">Animación: <span id="aname">Idle</span></div>
<div id="keys">
  <span class="k">W/↑</span><span class="kl">Caminar</span>
  <span class="k">⇧+W</span><span class="kl">Correr</span>
  <span class="k">Esp</span><span class="kl">Saltar</span>
  <span class="k">A D</span><span class="kl">Girar</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const sp = (p,t) => { document.getElementById('fill').style.width=p+'%'; document.getElementById('ltxt').textContent=t; };

window.addEventListener('load', async () => {

  const R = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));
  R.setSize(innerWidth,innerHeight);
  R.shadowMap.enabled = true;
  R.shadowMap.type = THREE.PCFSoftShadowMap;
  R.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x4a9eff);
  scene.fog = new THREE.Fog(0x4a9eff, 60, 200);

  const cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
  cam.position.set(0, 2, 5);
  cam.lookAt(0, 1, 0);

  // Luces
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
  sun.position.set(8,15,8); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-40; sun.shadow.camera.right=40;
  sun.shadow.camera.top=40;   sun.shadow.camera.bottom=-40;
  sun.shadow.camera.near=0.5; sun.shadow.camera.far=150;
  scene.add(sun);
  scene.add(Object.assign(new THREE.DirectionalLight(0xadd8ff,0.4),{position:new THREE.Vector3(-6,4,-4)}));

  // ── SUELO VERDE ───────────────────────────────────────────────
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    new THREE.MeshLambertMaterial({color:0x3db33d})
  );
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

  // ── CAMINOS DE TIERRA ─────────────────────────────────────────
  // Camino principal N-S
  const pathMat = new THREE.MeshLambertMaterial({color:0x8B6340});
  const addPath = (x,z,w,h,ry=0) => {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w,h), pathMat);
    p.rotation.x=-Math.PI/2; p.rotation.z=ry;
    p.position.set(x,0.01,z); p.receiveShadow=true; scene.add(p);
  };
  // Camino central largo N-S
  addPath(0, 0, 3, 200);
  // Camino E-O
  addPath(0, -20, 200, 3);
  // Camino E-O segundo
  addPath(0, 40, 200, 3);
  // Camino diagonal zona
  addPath(-30, 10, 3, 80, 0.4);

  // ── GRID SUTIL ────────────────────────────────────────────────
  const grid = new THREE.GridHelper(500,100,0x2a8a2a,0x2a8a2a);
  grid.position.y=0.005; grid.material.opacity=0.15; grid.material.transparent=true; scene.add(grid);

  // ── CÉSPED ────────────────────────────────────────────────────
  const gc=[0x2e9e2e,0x36b036,0x28882e,0x3ac43a];
  for(let i=0;i<400;i++){
    const h=0.06+Math.random()*0.18;
    const b=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.035,h,4),new THREE.MeshLambertMaterial({color:gc[i%4]}));
    const a=Math.random()*Math.PI*2, d=5+Math.random()*80;
    b.position.set(Math.cos(a)*d,h/2,Math.sin(a)*d); scene.add(b);
  }

  // ── NUBES ─────────────────────────────────────────────────────
  const cmat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.9});
  for(let i=0;i<12;i++){
    const g=new THREE.Group();
    for(let j=0;j<6;j++){
      const s=new THREE.Mesh(new THREE.SphereGeometry(1.2+Math.random()*2,8,6),cmat);
      s.position.set((Math.random()-.5)*7,(Math.random()-.5)*1.5,(Math.random()-.5)*3); g.add(s);
    }
    g.position.set((Math.random()-.5)*200,18+Math.random()*15,-20-Math.random()*100); scene.add(g);
  }

  // ── CARGAR GLBs ───────────────────────────────────────────────
  const loader = new THREE.GLTFLoader();
  const load = (url,label,pct) => new Promise(res=>{
    sp(pct,`Cargando ${label}...`);
    loader.load(url,res,undefined,e=>{console.error(label,e);res(null);});
  });

  const M='models/';
  sp(5,'Cargando personaje...');
  const gChar = await load(M+'Meshy_AI_Crimson_Hoodie_Portra_biped_Character_output.glb','personaje',10);
  const gWalk = await load(M+'Meshy_AI_Crimson_Hoodie_Portra_biped_Animation_Walking_withSkin.glb','walking',20);
  const gRun  = await load(M+'Meshy_AI_Crimson_Hoodie_Portra_biped_Animation_Running_withSkin.glb','running',30);
  const gJump = await load(M+'Meshy_AI_Animation_Regular_Jump_withSkin.glb','jumping',40);
  const gObjA = await load(M+'obj_a.glb','objeto A',55);
  const gObjB = await load(M+'obj_b.glb','objeto B',70);
  const gObjC = await load(M+'obj_c.glb','objeto C',85);
  sp(100,'¡Listo!');

  // ── FUNCIÓN PARA CLONAR Y COLOCAR OBJETOS ─────────────────────
  const placeObject = (gltf, x, z, scale=1, ry=0) => {
    if(!gltf) return;
    const clone = gltf.scene.clone(true);
    clone.scale.setScalar(scale);
    clone.position.set(x, 0, z);
    clone.rotation.y = ry;
    clone.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    scene.add(clone);
  };

  // ── DISTRIBUIR OBJETOS POR EL MAPA ───────────────────────────
  if(gObjA || gObjB || gObjC) {
    const objs = [gObjA, gObjB, gObjC].filter(Boolean);

    // Bordear camino central N-S con objetos (cada 6 unidades)
    for(let z=-90; z<=90; z+=6) {
      const g = objs[Math.floor(Math.random()*objs.length)];
      const ry = Math.random()*Math.PI*2;
      placeObject(g, -2.5, z, 1, ry);  // lado izquierdo
      placeObject(g,  2.5, z, 1, ry);  // lado derecho
    }

    // Bordear camino E-O (z=-20) con objetos
    for(let x=-90; x<=90; x+=6) {
      if(Math.abs(x)<4) continue; // hueco en cruce
      const g = objs[Math.floor(Math.random()*objs.length)];
      placeObject(g, x, -22.5, 1, Math.random()*Math.PI*2);
      placeObject(g, x, -17.5, 1, Math.random()*Math.PI*2);
    }

    // Bordear camino E-O (z=40)
    for(let x=-90; x<=90; x+=6) {
      if(Math.abs(x)<4) continue;
      const g = objs[Math.floor(Math.random()*objs.length)];
      placeObject(g, x, 37.5, 1, Math.random()*Math.PI*2);
      placeObject(g, x, 42.5, 1, Math.random()*Math.PI*2);
    }

    // Objetos dispersos por el mapa (grupos/bosquecillos)
    const clusters = [
      [-20,-30],[20,-30],[-40,10],[40,10],
      [-15,60],[15,60],[-50,-50],[50,-50],
      [0,80],[-60,30],[60,30],[30,-60],[-30,-60]
    ];
    clusters.forEach(([cx,cz]) => {
      for(let i=0;i<5+Math.floor(Math.random()*5);i++){
        const g = objs[Math.floor(Math.random()*objs.length)];
        const ox = cx + (Math.random()-.5)*10;
        const oz = cz + (Math.random()-.5)*10;
        placeObject(g, ox, oz, 0.8+Math.random()*0.5, Math.random()*Math.PI*2);
      }
    });
  }

  // ── FAROLAS (cilindro + esfera) ───────────────────────────────
  const poleMat  = new THREE.MeshLambertMaterial({color:0x555555});
  const lightMat = new THREE.MeshLambertMaterial({color:0xffffaa, emissive:0xffff44, emissiveIntensity:0.8});
  const addLamp = (x,z) => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,2.5,8), poleMat);
    pole.position.set(x,1.25,z); pole.castShadow=true; scene.add(pole);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8), lightMat);
    head.position.set(x,2.6,z); scene.add(head);
    // Punto de luz pequeño
    const pl = new THREE.PointLight(0xffffaa, 0.6, 8);
    pl.position.set(x,2.5,z); scene.add(pl);
  };

  // Farolas a lo largo del camino central
  for(let z=-80; z<=80; z+=10) {
    addLamp(-1.8, z);
    addLamp( 1.8, z);
  }
  // Farolas camino E-O
  for(let x=-80; x<=80; x+=10) {
    if(Math.abs(x)<4) continue;
    addLamp(x, -21.2);
    addLamp(x,  41.2);
  }

  // ── MONTAR PERSONAJE ──────────────────────────────────────────
  let char=null, mixer=null;
  const anims={};
  let curAct=null;

  if(gChar){
    char=gChar.scene;
    char.scale.setScalar(1.0);
    char.position.set(0,0,0);
    char.rotation.y=0;
    char.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});
    scene.add(char);
    mixer=new THREE.AnimationMixer(char);
    const addA=(g,name,loop=true)=>{
      if(!g?.animations?.length)return;
      const a=mixer.clipAction(g.animations[0]);
      if(!loop){a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;}
      anims[name]=a;
    };
    addA(gChar,'idle'); addA(gWalk,'walk'); addA(gRun,'run'); addA(gJump,'jump',false);
  }

  setTimeout(()=>{const el=document.getElementById('loading');el.style.opacity='0';setTimeout(()=>el.style.display='none',700);},300);

  const lbls={idle:'Idle',walk:'Caminando',run:'Corriendo',jump:'Saltando'};
  const play=name=>{
    if(!mixer)return;
    const next=anims[name]||anims['idle'];
    if(!next||curAct===next)return;
    if(curAct)curAct.fadeOut(0.2);
    next.reset().fadeIn(0.2).play();
    curAct=next;
    document.getElementById('aname').textContent=lbls[name]||'Idle';
  };
  setTimeout(()=>play('idle'),500);

  const K={};
  addEventListener('keydown',e=>{K[e.code]=true;});
  addEventListener('keyup',  e=>{K[e.code]=false;});
  let jumping=false,jv=0;
  addEventListener('keydown',e=>{
    if(e.code==='Space'&&!jumping&&char){
      jumping=true;jv=3.86;play('jump');
      if(anims['jump']){
        mixer.addEventListener('finished',function cb(ev){
          if(ev.action===anims['jump']){
            jumping=false;mixer.removeEventListener('finished',cb);
            play((K.KeyW||K.ArrowUp)?((K.ShiftLeft||K.ShiftRight)?'run':'walk'):'idle');
          }
        });
      }
    }
  });

  const CAM_OFF=new THREE.Vector3(0,1.6,-4.5);
  const camTgt=new THREE.Vector3(0,1,0);
  const clk=new THREE.Clock();

  (function loop(){
    requestAnimationFrame(loop);
    const dt=Math.min(clk.getDelta(),0.05);
    if(mixer)mixer.update(dt);
    if(char){
      const spd=(K.ShiftLeft||K.ShiftRight)?5.5:2.8;
      if(K.KeyA||K.ArrowLeft) char.rotation.y+=2.2*dt;
      if(K.KeyD||K.ArrowRight)char.rotation.y-=2.2*dt;
      let mov=false;
      if(K.KeyW||K.ArrowUp){
        const d=new THREE.Vector3(Math.sin(char.rotation.y),0,Math.cos(char.rotation.y));
        char.position.addScaledVector(d,spd*dt); mov=true;
      }
      if(jumping){jv+=-4*dt;char.position.y+=jv*dt;if(char.position.y<=0){char.position.y=0;if(!anims['jump']){jumping=false;jv=0;}}}
      if(!jumping){
        if(mov&&(K.ShiftLeft||K.ShiftRight))play('run');
        else if(mov)play('walk');
        else play('idle');
      }
      const wo=CAM_OFF.clone().applyEuler(new THREE.Euler(0,char.rotation.y,0));
      cam.position.lerp(char.position.clone().add(wo),1-Math.pow(0.001,dt));
      camTgt.lerp(char.position.clone().add(new THREE.Vector3(0,1,0)),1-Math.pow(0.0001,dt));
      cam.lookAt(camTgt);
    }
    R.render(scene,cam);
  })();

  addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
});
</script>
</body>
</html>
